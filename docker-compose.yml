
services:
  # Backend Service
  backend:
    build:
      context: ./e-commerce-backend
      dockerfile: DockerFile
    container_name: ecommerce-backend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
    volumes:
      - ./e-commerce-backend/src:/app/src
      - ./e-commerce-backend/node_modules:/app/node_modules
    command: npm run dev
    networks:
      - ecommerce-network
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./e-commerce-frontend
      dockerfile: DockerFile
    container_name: ecommerce-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://backend:5000
    volumes:
      - ./e-commerce-frontend/src:/app/src
      - ./e-commerce-frontend/public:/app/public
      - ./e-commerce-frontend/node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - ecommerce-network
    restart: unless-stopped

networks:
  ecommerce-network:
    driver: bridge

volumes:
  backend_node_modules:
  frontend_node_modules:
