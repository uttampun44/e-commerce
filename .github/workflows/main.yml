name: UnitDeals CI/CD Pipeline

on:
  push:
    branches:
      - main
      - development

jobs:
  backend:
    name: Build Backend
    uses: ./.github/workflows/backend.yml
    with:
      node-version: '24'
      working-directory: './e-commerce-backend'
    secrets:
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      NODE_ENV: ${{ secrets.NODE_ENV }}

  frontend:
    name: Build Frontend
    uses: ./.github/workflows/frontend.yml
    with:
      node-version: '24'
      working-directory: './e-commerce-frontend'
    secrets:
      FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}

  # Simple success check
  check-success:
    name: All Builds Complete
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ All builds passed!"